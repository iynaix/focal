[package]
name = "focal"
version = "0.1.0"
authors = ["iynaix"]

edition = "2024"
build = "build.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.2", features = ["derive", "string"] }
clap_complete = "4.6.7"
clap_mangen = "0.3.0"
ctrlc = "3.5.2"
dirs = "6.0.0"
execute = "0.3.0"
hyprland = { version = "0.4.0-beta.3" }
image = "0.25.10"
niri-ipc = "26.4.0"
notify-rust = "4.18.0"
regex = "1.13.1"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.150"
which = "8.0.5"

[build-dependencies]
clap = { version = "4.6.2", features = ["derive", "string"] }
clap_complete = "4.6.7"
clap_mangen = "0.3.0"

[features]
default = ["ocr", "video"]
ocr = []
video = []
waybar = []

[[bin]]
name = "focal-waybar"
path = "src/bin/focal-waybar.rs"
required-features = ["waybar"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"

[profile.release]
strip = true
lto = true
